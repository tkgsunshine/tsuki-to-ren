<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:'SM';font-weight:700;src:url('fonts/sm700.woff2') format('woff2')}
@font-face{font-family:'SM';font-weight:500;src:url('fonts/sm500.woff2') format('woff2')}
html,body{margin:0;width:1500px;height:500px;overflow:hidden;background:#0a0714}
.h{position:relative;width:1500px;height:500px;font-family:'SM','IPAPGothic',serif;color:#f4efe2;
 background:radial-gradient(520px 420px at 25% 55%,rgba(168,85,247,.35),transparent 65%),
            radial-gradient(520px 420px at 75% 55%,rgba(59,130,246,.30),transparent 65%),
            linear-gradient(135deg,#0a0714 0%,#150f2c 55%,#1c1236 100%)}
svg{position:absolute;inset:0}
.c{position:absolute;top:30px;height:500px;width:372px;
 -webkit-mask-image:radial-gradient(ellipse 52% 56% at 50% 46%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 52% 56% at 50% 46%,#000 55%,transparent 100%)}
.c img{width:372px;height:500px;display:block}
.tsuki{left:262px}.ren{left:866px}
.t{position:absolute;left:564px;top:125px;width:400px;text-align:center}
.badge{display:inline-block;font-weight:500;font-size:20px;letter-spacing:.12em;color:#e2c074;border:1.5px solid rgba(226,192,116,.6);border-radius:999px;padding:6px 20px;background:rgba(10,10,20,.5)}
.t1{margin-top:18px;font-weight:700;font-size:50px;letter-spacing:.03em;line-height:1.25;text-shadow:0 0 26px rgba(226,192,116,.4)}
.t1 b{color:#e2c074;font-weight:700}
.t2{margin-top:14px;font-weight:500;font-size:22px;letter-spacing:.04em;line-height:1.4;color:#e8e2f7}
</style>
<div class="h">
<svg width="1500" height="500" id="st"></svg>
<div class="c tsuki"><img src="tsuki.jpg"></div>
<div class="c ren"><img src="ren.jpg"></div>
<div class="t">
 <div class="badge">月と蓮 運営</div>
 <div class="t1">今日の空気を、<br><b>そっと。</b></div>
 <div class="t2">四柱推命 × 九星気学<br>× 16タイプ（MBTI）</div>
</div>
</div>
<script>
let s=7,r=()=>(s=(s*16807)%2147483647)/2147483647,o='';
for(let i=0;i<60;i++){const x=r()*1500,y=r()*400,z=r()*1.6+.4;o+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${z.toFixed(1)}" fill="#fff" opacity="${(r()*.5+.2).toFixed(2)}"/>`}
document.getElementById('st').innerHTML=o;
</script>
