<!doctype html><meta charset="utf-8"><!-- トップのOGP（2026-11-02 Xヘッダーと同じ文字の組み方：コピー→方式3行を頭と幅をそろえて縦積み。元は2026-11-01 A案）。app-screen.png はアプリの鑑定結果画面（390幅×3倍）を切り抜いたもの。Playwrightで1200×630を撮って public/ogp-image.jpg に -->
<style>
@font-face{font-family:'SM';font-weight:700;src:url('../../../scripts/x/assets/ShipporiMincho-Bold.ttf')}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0a0714}

 background:radial-gradient(420px 460px at 18% 55%,rgba(168,85,247,.38),transparent 65%),
            radial-gradient(420px 460px at 85% 55%,rgba(59,130,246,.32),transparent 65%),

svg.st{position:absolute;inset:0}

.big{font-size:68px;line-height:1.18;letter-spacing:.04em;text-shadow:0 0 28px rgba(160,140,255,.45)}
.big .x{color:#e2c074;font-size:52px;margin-right:10px}
.big .m{color:#9cc6ff}
.big small{font-size:30px;color:#e8e2f7;letter-spacing:.02em}
.sub{font-size:32px;letter-spacing:.08em;color:#f4efe2}

</style>
<style>
.tsuki{left:-70px;top:40px;width:420px;height:562px}
.ren{left:900px;top:40px;width:420px;height:562px;opacity:.95}
.t{position:absolute;left:250px;top:48px;width:480px;text-align:center}

.mt{margin-top:22px;text-shadow:0 0 24px rgba(160,140,255,.45)}

.mn{display:block;font-size:52px;line-height:1.1;white-space:nowrap}
.mn.b{color:#9cc6ff;font-size:60px;letter-spacing:10.1px;text-indent:10.1px}
.mx{display:block;color:#e2c074;font-size:30px;line-height:1.05}
.phone{left:740px;top:34px;width:258px;transform:rotate(4deg)}
.phone img{width:258px}

 <div class="badge">月と蓮</div>

 </div>
</div>

</div><script>let s=11,r=()=>(s=(s*16807)%2147483647)/2147483647,o="";for(let i=0;i<70;i++){const x=r()*1200,y=r()*630,z=r()*1.5+.4;o+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${z.toFixed(1)}" fill="#fff" opacity="${(r()*.5+.15).toFixed(2)}"/>`}document.getElementById("st").innerHTML=o;</script>
