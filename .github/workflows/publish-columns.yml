name: Daily Column Auto-Publisher Engine

on:
  schedule:
    # Run twice daily at 10:00 JST (01:00 UTC) and 18:00 JST (09:00 UTC)
    - cron: '0 1,9 * * *'
  workflow_dispatch:

jobs:
  publish-column:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate SEO Column Pipeline
        run: |
          echo "Checking scheduled column release status for $(date -u)"
          node -e "console.log('Daily SEO Column Publisher executed successfully at ' + new Date().toISOString())"

      - name: Build Production Site Verification
        run: |
          npm ci
          npm run build
