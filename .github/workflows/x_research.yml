name: X Research (Hasu-to-Tsuki)

# 伸びている型の調査（週1回）:
#   1) data/x/research/accounts.json の見本アカウントの直近7日の投稿を X API で読む（scripts/x/research.mjs → latest.json / latest.md）
#   2) いま伸びている型のまとめと、月と蓮の投稿案を Claude で作る（scripts/x/research-drafts.mjs → trends.md / drafts.json）
# 投稿案は確認用で、キュー（data/x/queue.json）やホームには入れない。投稿の仕組みには影響しない。
# X API の読み取りは件数に応じて料金がかかる（アカウントごとに最大100件）。
on:
  schedule:
    - cron: '0 21 * * 0' # 毎週月曜 6:00 JST
  workflow_dispatch:
    inputs:
      days:
        description: '何日分を読むか'
        default: '7'
  # 確認用（PRのマージ前に外す）: 作業ブランチへの push で1回実行する
  push:
    branches:
      - claude/project-thread-6nqqaq
    paths:
      - scripts/x/research-drafts.mjs

permissions:
  contents: write

concurrency:
  group: x-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install

      - name: Fetch posts
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node scripts/x/research.mjs --days "${{ github.event.inputs.days || '7' }}"

      - name: Summarize trends and write drafts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/x/research-drafts.mjs

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/x/research/
          if git diff --staged --quiet; then
            echo "No research changes."
          else
            git commit -m "chore(x): update trend research"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
