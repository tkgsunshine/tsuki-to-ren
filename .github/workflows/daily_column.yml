name: Off-Peak & Auto-Retry Column Generator (Hasu-to-Tsuki)

on:
  schedule:
    # 朝枠: 8:07, 8:22, 8:37 JST (UTC 23:07, 23:22, 23:37)
    - cron: '7,22,37 23 * * *'
    # 夕枠: 17:07, 17:22, 17:37 JST (UTC 08:07, 08:22, 08:37)
    - cron: '7,22,37 8 * * *'
  workflow_dispatch:

jobs:
  generate-column:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Column Generator Engine
        run: node scripts/generate-column.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/columnsData.ts public/sitemap.xml
          if git diff --staged --quiet; then
            echo "No new column updates this run. Exiting safely."
          else
            git commit -m "feat(column): auto-publish scheduled column for Hasu-to-Tsuki"
            git push origin main
          fi
