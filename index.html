<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons & Favicons for All Platforms (Chrome, Safari, iOS, Google Search, Bookmarks) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- High Priority LCP Image Preload -->
    <link rel="preload" as="image" href="/assets/tsuki.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/ren.webp" type="image/webp" fetchpriority="high" />

    <!-- Google Fonts: Optimized Non-Blocking Load with Preconnect & DNS Prefetch -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Shippori+Mincho:wght@500;700&family=Inter:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Shippori+Mincho:wght@500;700&family=Inter:wght@400;600&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Shippori+Mincho:wght@500;700&family=Inter:wght@400;600&display=swap"></noscript>

    <!-- Google Identity Services SDK for Native Google Account Selector Popup -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Apple ID Official Sign-In SDK (Deferred) -->
    <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleauth/1/en_US/appleid.auth.js" defer></script>
  </head>
  <body class="bg-black text-white antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
